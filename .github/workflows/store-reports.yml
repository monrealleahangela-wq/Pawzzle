name: Send scheduled store reports

on:
  schedule:
    # Runs daily at 9:15 AM Philippine time
    - cron: "15 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pawzzle-store-reports
  cancel-in-progress: false

jobs:
  send-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download Pawzzle
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Send reports that are due
        run: npm run jobs:store-reports
        env:
          NODE_ENV: production
          CLIENT_URL: https://pawzzle.io
          STORE_REPORT_BATCH_SIZE: "25"
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
