services:
  - type: web
    name: pawzzle
    env: node
    buildCommand: npm run install-all && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      - key: RECAPTCHA_SITE_KEY
        value: 6LckpYUtAAAAALNjXnyczMrAwdl_bLUO8xzEoW5-
      - key: REACT_APP_RECAPTCHA_SITE_KEY
        value: 6LckpYUtAAAAALNjXnyczMrAwdl_bLUO8xzEoW5-
      - key: AWS_REGION
        value: ap-southeast-1
      - key: AWS_REKOGNITION_REGION
        value: ap-southeast-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORE_DOCUMENTS_BUCKET
        sync: false
      - key: IDENTITY_DOCUMENT_ENCRYPTION_KEY
        sync: false
      - key: IDENTITY_FACE_MATCH_THRESHOLD
        value: "95"
      # Product-variant switches stay operator-controlled. Run the guarded
      # readiness procedures before setting any verification flag to true.
      - key: SELLER_VARIANTS_ENABLED
        sync: false
      - key: SELLER_VARIANTS_CONCURRENCY_VERIFIED
        sync: false
      - key: SELLER_VARIANTS_AUTHORIZATION_VERIFIED
        sync: false
      - key: SELLER_VARIANT_INVENTORY_ENABLED
        sync: false
      - key: SELLER_VARIANT_INVENTORY_CONCURRENCY_VERIFIED
        sync: false
      - key: CUSTOMER_VARIANT_BROWSING_ENABLED
        sync: false
      - key: CUSTOMER_VARIANT_PURCHASING_ENABLED
        sync: false
      - key: CUSTOMER_VARIANT_RESERVATION_CONCURRENCY_VERIFIED
        sync: false
      - key: CUSTOMER_VARIANT_PAYMENT_RECONCILIATION_VERIFIED
        sync: false
      - key: CUSTOMER_VARIANT_AUTHORIZATION_VERIFIED
        sync: false
      - key: SUPPLIER_VARIANTS_ENABLED
        sync: false
      - key: SUPPLIER_VARIANT_MAPPING_ENABLED
        sync: false
      - key: SUPPLIER_VARIANT_PROCUREMENT_ENABLED
        sync: false
      - key: SUPPLIER_VARIANT_PROCUREMENT_CONCURRENCY_VERIFIED
        sync: false
      - key: SUPPLIER_VARIANT_RECEIVING_ENABLED
        sync: false
