services:
  - type: web
    name: pawzzle
    env: node
    buildCommand: npm run install-all && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      - key: RECAPTCHA_SITE_KEY
        value: 6LckpYUtAAAAALNjXnyczMrAwdl_bLUO8xzEoW5-
      - key: REACT_APP_RECAPTCHA_SITE_KEY
        value: 6LckpYUtAAAAALNjXnyczMrAwdl_bLUO8xzEoW5-
      - key: AWS_REGION
        value: ap-southeast-1
      - key: AWS_REKOGNITION_REGION
        value: ap-southeast-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORE_DOCUMENTS_BUCKET
        sync: false
      - key: REACT_APP_GOOGLE_MAPS_API_KEY
        sync: false
      - key: IDENTITY_DOCUMENT_ENCRYPTION_KEY
        sync: false
      - key: IDENTITY_FACE_MATCH_THRESHOLD
        value: "95"
